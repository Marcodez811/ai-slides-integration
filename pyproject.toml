[project]
name = "ai-slides-generation-v2"
version = "0.1.0"
description = "Auditable DOCX extraction and slide-generation research pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dwml>=0.3",
    "lxml>=5.3.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "openai>=2.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docx_pipeline", "presentation_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "python-docx>=1.2.0",
]

[project.scripts]
docx-pipeline = "docx_pipeline.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
